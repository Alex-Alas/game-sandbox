<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<meta name="theme-color" content="#0d0b12" />
<meta name="description" content="GRISÚ: escaparate de los assets en 3D pixelado. Personajes, enemigos, la galería de la mina, efectos, retratos e íconos." />
<title>GRISÚ · escaparate</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'%3E%3Crect x='4' y='2' width='8' height='12' fill='%23b88e44'/%3E%3Crect x='5' y='5' width='6' height='6' fill='%233bded3'/%3E%3Crect x='3' y='13' width='10' height='2' fill='%231b1420'/%3E%3C/svg%3E">
<style>
  :root {
    --ink: #1b1420; --slate: #262531; --slate2: #3d354c; --brass: #b88e44; --brass2: #f3d27e; --brassD: #583e20; --parch: #dbbf9b; --parch2: #9a8c92;
    --arc: #3bded3; --red: #c92821; --panel: rgba(27, 20, 32, 0.9); --line: rgba(219, 191, 155, 0.2);
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --sat: env(safe-area-inset-top); --sab: env(safe-area-inset-bottom); --sal: env(safe-area-inset-left); --sar: env(safe-area-inset-right);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d0b12; color: var(--parch); font-family: var(--sans);
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  canvas#game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  [hidden] { display: none !important; }
  button { font: inherit; color: inherit; }

  /* marco de latón con esquinas en escalón (píxel) */
  .px { border: 2px solid var(--brassD); box-shadow: inset 0 0 0 2px var(--ink), inset 0 2px 0 2px rgba(243, 210, 126, .18), 0 4px 0 var(--ink);
    background: var(--panel); clip-path: polygon(0 4px, 4px 4px, 4px 0, calc(100% - 4px) 0, calc(100% - 4px) 4px, 100% 4px, 100% calc(100% - 4px), calc(100% - 4px) calc(100% - 4px), calc(100% - 4px) 100%, 4px 100%, 4px calc(100% - 4px), 0 calc(100% - 4px)); }

  #top { position: fixed; top: calc(10px + var(--sat)); left: calc(12px + var(--sal)); right: calc(12px + var(--sar)); display: flex; align-items: flex-start; gap: 10px; pointer-events: none; z-index: 5; }
  #brand { pointer-events: auto; display: flex; align-items: center; gap: 10px; }
  #brand canvas { image-rendering: pixelated; height: 40px; }
  #brand .sub { font: 700 10px var(--mono); letter-spacing: .22em; text-transform: uppercase; color: var(--parch2); line-height: 1.6; text-shadow: 0 1px 0 var(--ink); }
  #brand .sub b { color: var(--brass2); }
  .grow { flex: 1; }
  #tools { display: flex; gap: 6px; align-items: center; pointer-events: auto; flex-wrap: wrap; justify-content: flex-end; }
  .seg { display: inline-flex; padding: 3px; gap: 2px; }
  .seg > span { font: 700 9px var(--mono); letter-spacing: .18em; color: var(--parch2); align-self: center; padding: 0 6px 0 4px; text-transform: uppercase; }
  .seg button { border: 0; background: transparent; padding: 6px 8px; font: 700 11px var(--mono); cursor: pointer; color: var(--parch2); min-width: 34px; }
  .seg button[aria-pressed=true] { background: var(--brass); color: var(--ink); box-shadow: inset 0 -2px 0 var(--brassD), inset 0 2px 0 var(--brass2); }
  .ib { width: 40px; height: 40px; display: grid; place-items: center; cursor: pointer; padding: 0; }
  .ib svg { width: 18px; height: 18px; }
  .ib[aria-pressed=false] { opacity: .55; }

  #tabs { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(10px + var(--sab)); display: flex; gap: 2px; padding: 4px; z-index: 6; max-width: calc(100vw - 16px); overflow-x: auto; scrollbar-width: none; }
  #tabs::-webkit-scrollbar { display: none; }
  #tabs button { border: 0; background: transparent; padding: 9px 13px; font: 700 11px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--parch2); cursor: pointer; white-space: nowrap; }
  #tabs button[aria-selected=true] { background: var(--brass); color: var(--ink); box-shadow: inset 0 -3px 0 var(--brassD), inset 0 2px 0 var(--brass2); }

  #panel { position: fixed; right: calc(12px + var(--sar)); top: calc(64px + var(--sat)); width: 290px; max-height: calc(100vh - 140px - var(--sat) - var(--sab)); overflow-y: auto; padding: 14px; z-index: 4; scrollbar-width: thin; }
  #panel h2 { margin: 0; font: 800 17px var(--mono); letter-spacing: .12em; color: var(--brass2); text-transform: uppercase; }
  #panel .lead { margin: 4px 0 10px; font-size: 12px; line-height: 1.5; color: var(--parch2); }
  #panel h3 { margin: 12px 0 6px; font: 700 9px var(--mono); letter-spacing: .24em; text-transform: uppercase; color: var(--arc); }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .chip { border: 2px solid var(--slate2); background: var(--slate); padding: 6px 9px; font: 600 11.5px var(--sans); cursor: pointer; color: var(--parch); }
  .chip:hover { border-color: var(--brassD); }
  .chip[aria-pressed=true] { border-color: var(--brass); background: #3a2f22; color: var(--brass2); }
  .chip.sw { width: 30px; height: 30px; padding: 0; }
  .row { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
  .btn { border: 2px solid var(--slate2); background: var(--slate); padding: 6px 10px; font: 700 12px var(--mono); cursor: pointer; min-width: 36px; min-height: 34px; color: var(--parch); }
  .btn:hover { border-color: var(--brass); }
  .meta { font: 700 11px var(--mono); color: var(--parch2); letter-spacing: .04em; }
  .tog { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 6px 0; border-bottom: 1px dashed rgba(219,191,155,.12); font-size: 12.5px; cursor: pointer; }
  .tog small { display: block; color: var(--parch2); font-size: 10.5px; margin-top: 1px; }
  .box { width: 16px; height: 16px; border: 2px solid var(--slate2); background: var(--ink); flex: none; }
  .tog[aria-checked=true] .box { background: var(--arc); border-color: #1d8a8a; box-shadow: inset 0 0 0 2px var(--ink); }
  #caption { position: fixed; left: 14px; bottom: calc(64px + var(--sab)); font: 700 12px var(--mono); letter-spacing: .1em; color: var(--parch); text-shadow: 0 2px 0 var(--ink), 0 0 6px var(--ink); pointer-events: none; z-index: 3; }
  #caption b { color: var(--brass2); font-size: 15px; display: block; letter-spacing: .14em; }
  #split { position: fixed; top: 0; bottom: 0; width: 28px; margin-left: -14px; cursor: ew-resize; z-index: 3; touch-action: none; }
  #split::before { content: ''; position: absolute; left: 13px; top: 0; bottom: 0; width: 2px; background: var(--brass2); box-shadow: 0 0 0 1px var(--ink); }
  #split::after { content: '3D  |  PÍXEL'; position: absolute; top: 46%; left: 50%; transform: translateX(-50%); white-space: pre; font: 700 10px var(--mono); letter-spacing: .12em; padding: 5px 8px; background: var(--brass); color: var(--ink); }
  #toggle { display: none; }

  /* RETRATOS */
  #gallery { position: fixed; inset: 0; z-index: 2; overflow-y: auto; padding: calc(70px + var(--sat)) 16px calc(80px + var(--sab)); background: radial-gradient(ellipse at 50% 40%, rgba(27,20,32,.55), rgba(13,11,18,.92)); }
  #gallery .wrap { max-width: 1100px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .card { padding: 10px; }
  .card canvas { width: 100%; height: auto; display: block; }
  .card .nm { font: 800 14px var(--mono); letter-spacing: .14em; color: var(--brass2); margin-top: 8px; }
  .card .ds { font-size: 12px; color: var(--parch2); margin-top: 2px; }
  #icons { grid-column: 1 / -1; padding: 14px; }
  #icons h3 { margin: 0 0 10px; font: 700 10px var(--mono); letter-spacing: .24em; color: var(--arc); text-transform: uppercase; }
  #icons .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 10px; }
  #icons .ic { text-align: center; font-size: 10.5px; color: var(--parch2); line-height: 1.3; }
  #icons .ic canvas { width: 72px; height: 72px; image-rendering: pixelated; display: block; margin: 0 auto 4px; background: var(--slate); box-shadow: inset 0 0 0 2px var(--ink); }

  @media (max-width: 760px), (max-height: 520px) {
    #panel { top: auto; right: 0; left: 0; bottom: calc(52px + var(--sab)); width: auto; max-height: 42vh; margin: 0 8px; }
    #panel.closed { display: none; }
    #toggle { display: grid; }
    #caption { bottom: auto; top: calc(62px + var(--sat)); }
    #gallery .wrap { grid-template-columns: 1fr; }
    #brand .sub { display: none; }
  }
  @media (max-height: 520px) and (min-width: 700px) {
    #panel { left: auto; right: calc(8px + var(--sar)); width: 300px; top: calc(56px + var(--sat)); bottom: calc(52px + var(--sab)); max-height: none; }
    #gallery .wrap { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="split" hidden></div>
<div id="caption"></div>
<div id="top">
  <div id="brand"><canvas id="logo" width="96" height="20"></canvas><div class="sub"><b>Escaparate de assets</b><br>3D pixelado · Las Galerías</div></div>
  <div class="grow"></div>
  <div id="tools">
    <div class="seg px" id="heights"><span>Alto</span></div>
    <button class="ib px" id="toggle" aria-label="Panel"><svg viewBox="0 0 16 16" shape-rendering="crispEdges"><rect x="2" y="3" width="12" height="2" fill="currentColor"/><rect x="2" y="7" width="12" height="2" fill="currentColor"/><rect x="2" y="11" width="12" height="2" fill="currentColor"/></svg></button>
    <button class="ib px" id="snd" aria-label="Sonido" aria-pressed="true"><svg viewBox="0 0 16 16" shape-rendering="crispEdges"><path d="M2 6h3l4-3v10l-4-3H2z" fill="currentColor"/><rect x="11" y="5" width="2" height="6" fill="currentColor"/></svg></button>
    <button class="ib px" id="fs" aria-label="Pantalla completa"><svg viewBox="0 0 16 16" shape-rendering="crispEdges"><path d="M1 1h5v2H3v3H1zM10 1h5v5h-2V3h-3zM1 10h2v3h3v2H1zM13 10h2v5h-5v-2h3z" fill="currentColor"/></svg></button>
  </div>
</div>
<div id="panel" class="px"></div>
<div id="tabs" class="px" role="tablist"></div>
<div id="gallery" hidden><div class="wrap"></div></div>
<script type="module" src="./src/main.ts"></script>
</body>
</html>
