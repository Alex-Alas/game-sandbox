<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<meta name="theme-color" content="#1a1033" />
<title>CATAPUM</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='9' r='6' fill='%23ff7a3d'/%3E%3Ccircle cx='12' cy='3' r='2' fill='%23ffd23f'/%3E%3C/svg%3E">
<style>
  :root { --bg: #1a1033; --panel: #2a1d4f; --panel2: #34265f; --ink: #fff; --dim: #b9b0d9; --yellow: #ffd23f; --orange: #ff7a3d;
    --cyan: #3fd0c9; --red: #ff5a5a; --green: #6fe36a; --font: system-ui, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink); font-family: var(--font);
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  canvas#game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  [hidden] { display: none !important; }
  #ui { position: fixed; inset: 0; overflow: hidden; }
  #ui.dim { background: radial-gradient(ellipse at 50% 40%, rgba(26,16,51,0.55), rgba(26,16,51,0.92)); }
  .screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; overflow-y: auto; overscroll-behavior: contain;
    padding: max(10px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left)); }
  .wrap { width: min(980px, 100%); display: flex; flex-direction: column; gap: 10px; margin: auto 0; }
  h1.logo { margin: 0; font-size: clamp(52px, 13vw, 128px); font-weight: 900; letter-spacing: 2px; line-height: 0.9; color: var(--yellow);
    text-align: center; -webkit-text-stroke: 3px #2a1300; paint-order: stroke fill; text-shadow: 0 6px 0 #ff7a3d, 0 12px 0 #2a1300, 0 0 40px rgba(255,122,61,0.6);
    transform: rotate(-4deg); animation: wob 2.4s ease-in-out infinite; }
  @keyframes wob { 50% { transform: rotate(-2deg) scale(1.03); } }
  .sub { text-align: center; color: var(--dim); font-weight: 700; letter-spacing: 2px; font-size: 12px; margin-top: 8px; }
  h2 { margin: 0; font-size: 22px; font-weight: 900; letter-spacing: 1px; color: var(--yellow); -webkit-text-stroke: 1px #2a1300; paint-order: stroke fill; }
  h3 { margin: 8px 0 4px; font-size: 12px; letter-spacing: 1.5px; color: var(--cyan); text-transform: uppercase; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .row.c { justify-content: center; }
  .grow { flex: 1; }
  .btn { font: 900 15px var(--font); letter-spacing: 1px; text-transform: uppercase; color: #2a1300; background: var(--yellow); border: 3px solid #2a1300;
    border-radius: 14px; padding: 10px 18px; min-height: 44px; cursor: pointer; box-shadow: 0 5px 0 #2a1300; transition: transform .06s, box-shadow .06s; }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #2a1300; }
  .btn.big { font-size: 22px; padding: 12px 28px; min-height: 58px; }
  .btn.alt { background: var(--cyan); } .btn.red { background: var(--red); } .btn.orange { background: var(--orange); }
  .btn.ghost { background: var(--panel2); color: var(--ink); border-color: #0d0820; box-shadow: 0 4px 0 #0d0820; }
  .btn.sm { font-size: 12px; padding: 6px 10px; min-height: 34px; border-width: 2px; box-shadow: 0 3px 0 #2a1300; border-radius: 10px; }
  .btn[disabled] { opacity: .45; pointer-events: none; }
  .menu { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; width: min(640px, 100%); margin: 14px auto 0; }
  .panel { background: var(--panel); border: 3px solid #0d0820; border-radius: 16px; padding: 10px 12px; box-shadow: 0 6px 0 #0d0820; }
  .seg { display: flex; gap: 4px; flex-wrap: wrap; }
  .seg button { font: 800 12px var(--font); color: var(--ink); background: var(--panel2); border: 2px solid #0d0820; border-radius: 9px; padding: 6px 10px; min-height: 34px; cursor: pointer; }
  .seg button[aria-pressed=true] { background: var(--yellow); color: #2a1300; }
  .opt { display: grid; grid-template-columns: 110px 1fr; gap: 8px; align-items: center; min-height: 40px; }
  .opt > span { font-weight: 800; font-size: 12px; color: var(--dim); letter-spacing: 1px; }
  .stepper { display: flex; align-items: center; gap: 6px; } .stepper b { min-width: 28px; text-align: center; font-size: 18px; }
  .two { display: grid; grid-template-columns: minmax(220px, 300px) 1fr; gap: 12px; }
  @media (max-width: 640px) { .two { grid-template-columns: 1fr; } .opt { grid-template-columns: 90px 1fr; } }
  .chars { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; }
  .char { background: var(--panel2); border: 3px solid #0d0820; border-radius: 14px; padding: 4px; cursor: pointer; text-align: center; font-weight: 900; font-size: 12px; }
  .char[aria-pressed=true] { border-color: var(--yellow); background: #4a3a7a; }
  .char canvas { width: 100%; aspect-ratio: 1; display: block; }
  .hero { display: flex; gap: 10px; align-items: center; }
  .hero canvas { width: 96px; height: 96px; flex: none; }
  .hero .nm { font-size: 24px; font-weight: 900; }
  .hero .ds { color: var(--dim); font-size: 12px; }
  .ulti { margin-top: 6px; padding: 6px 8px; border-radius: 10px; background: #1b1238; font-size: 12px; }
  .ulti b { color: var(--yellow); }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 6px; }
  .card { position: relative; border: 3px solid #9a93b8; border-radius: 10px; background: #1b1530; padding: 3px; cursor: pointer; text-align: center; min-height: 92px; }
  .card.r1 { border-color: #6fb7ff; } .card.r2 { border-color: var(--yellow); }
  .card .art { border-radius: 7px; font-size: 30px; line-height: 50px; height: 50px; }
  .card .nm { font-size: 9.5px; font-weight: 900; margin-top: 3px; line-height: 1.1; }
  .card .cost { position: absolute; top: -6px; left: -6px; width: 22px; height: 22px; border-radius: 50%; background: #4f8bff; border: 2px solid #0d0820; font-weight: 900; font-size: 12px; line-height: 18px; }
  .card.in { opacity: .35; }
  .card.sel { outline: 3px solid #fff; outline-offset: 2px; }
  .card.empty { border-style: dashed; opacity: .5; }
  .info { background: #1b1238; border-radius: 12px; padding: 8px 10px; font-size: 12px; min-height: 56px; }
  .info b { color: var(--yellow); }
  .tabs { display: flex; gap: 4px; flex-wrap: wrap; }
  .tabs button { font: 900 12px var(--font); padding: 8px 12px; border-radius: 10px; border: 2px solid #0d0820; background: var(--panel2); color: var(--ink); cursor: pointer; }
  .tabs button[aria-selected=true] { background: var(--cyan); color: #06201e; }
  label.chk { display: flex; gap: 8px; align-items: center; font-weight: 700; font-size: 13px; min-height: 36px; cursor: pointer; }
  input[type=checkbox] { width: 22px; height: 22px; accent-color: var(--yellow); }
  input[type=range] { width: 100%; accent-color: var(--yellow); }
  input[type=text] { font: 900 22px var(--font); text-transform: uppercase; letter-spacing: 6px; text-align: center; width: 9ch; padding: 6px; border-radius: 12px; border: 3px solid #0d0820; background: #fff; color: #2a1300; }
  input.name { letter-spacing: 1px; text-transform: none; width: 14ch; font-size: 16px; }
  .slider { display: grid; grid-template-columns: minmax(10em, 1fr) minmax(8em, 1.4fr) 3.5em; gap: 8px; align-items: center; font-size: 12px; min-height: 30px; }
  .slider output { text-align: right; color: var(--dim); }
  .code { font-size: 44px; font-weight: 900; letter-spacing: 10px; color: var(--yellow); -webkit-text-stroke: 2px #2a1300; paint-order: stroke fill; }
  .players { display: flex; flex-direction: column; gap: 6px; }
  .pl { display: flex; align-items: center; gap: 8px; background: var(--panel2); border-radius: 10px; padding: 4px 8px; font-weight: 800; font-size: 13px; }
  .pl canvas { width: 34px; height: 34px; }
  .pl .tag { margin-left: auto; font-size: 10px; color: var(--dim); }
  .qr svg { width: 120px; height: 120px; background: #fff; border-radius: 8px; padding: 4px; }
  .howto p { margin: 4px 0; font-size: 13px; line-height: 1.45; }
  .howto kbd { background: #0d0820; border-radius: 5px; padding: 1px 6px; font-weight: 800; font-size: 11px; }
  .podium { display: flex; align-items: flex-end; justify-content: center; gap: 10px; min-height: 160px; }
  .podium > div { text-align: center; font-weight: 900; }
  .podium .step { border: 3px solid #0d0820; border-radius: 12px 12px 0 0; width: 96px; display: flex; align-items: center; justify-content: center; font-size: 28px; }
  .podium canvas { width: 80px; height: 80px; }
  table.res { width: 100%; border-collapse: collapse; font-size: 12px; }
  table.res td, table.res th { padding: 4px 6px; text-align: right; } table.res td:first-child, table.res th:first-child { text-align: left; }
  table.res tr:nth-child(odd) td { background: rgba(255,255,255,0.04); }
  #pausebtn { position: fixed; top: max(6px, env(safe-area-inset-top)); left: max(6px, env(safe-area-inset-left)); width: 42px; height: 42px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.4); background: rgba(0,0,0,0.35); color: #fff; font-size: 18px; cursor: pointer; z-index: 5; }
  #toast { position: fixed; left: 50%; top: 18%; transform: translateX(-50%); background: rgba(10,6,24,0.9); padding: 10px 16px; border-radius: 12px; font-weight: 800; font-size: 14px; z-index: 20; max-width: 90%; text-align: center; }
  .note { color: var(--dim); font-size: 12px; line-height: 1.4; }
  .err { color: var(--red); font-weight: 800; font-size: 13px; }
  .mapgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 6px; }
  .map { border: 3px solid #0d0820; border-radius: 12px; overflow: hidden; cursor: pointer; background: var(--panel2); font-size: 11px; font-weight: 900; text-align: center; }
  .map canvas { width: 100%; display: block; aspect-ratio: 16/9; }
  .map[aria-pressed=true] { border-color: var(--yellow); }
  @media (max-height: 520px) {
    .mapgrid { grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); }
    .map { font-size: 9.5px; }
    .hero canvas { width: 64px; height: 64px; } .hero .nm { font-size: 18px; }
    .cards { grid-template-columns: repeat(auto-fill, minmax(62px, 1fr)); } .card { min-height: 76px; } .card .art { font-size: 22px; line-height: 38px; height: 38px; }
    h1.logo { font-size: clamp(44px, 11vw, 96px); } .menu { margin-top: 8px; gap: 8px; } .btn.big { min-height: 48px; font-size: 18px; }
  }
  #rotate { position: fixed; left: 50%; bottom: 46%; transform: translateX(-50%); background: rgba(10,6,24,0.85); padding: 8px 14px; border-radius: 12px; font-weight: 800; font-size: 13px; pointer-events: none; z-index: 6; }
  #editbar { position: fixed; left: 50%; top: 8px; transform: translateX(-50%); width: min(560px, calc(100% - 16px)); padding: 8px 10px; background: rgba(10,6,24,0.92); border: 2px solid var(--yellow); border-radius: 12px; z-index: 30; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui" class="dim"></div>
<button id="pausebtn" hidden title="pausa (Esc)">⏸</button>
<div id="toast" hidden></div>
<div id="editbar" hidden></div>
<div id="rotate" hidden>📱↻ Girá el teléfono: se juega acostado</div>
<script type="module" src="./src/main.ts"></script>
</body>
</html>
